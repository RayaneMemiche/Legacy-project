# =================================================================
# CI/CD Pipeline - AWKWARD LEGACY
# =================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, rayane, develop ]
  pull_request:
    branches: [ main, rayane ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------
  # Job 1: Lint & Code Quality
  # ---------------------------------------------------------------
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        working-directory: LegacyProject/modernProject
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort bandit

      - name: 🎨 Check code formatting (Black)
        working-directory: LegacyProject/modernProject
        run: |
          black --check lib/ tests/ || echo "::warning::Code not formatted"

      - name: 🔍 Lint with Flake8
        working-directory: LegacyProject/modernProject
        run: |
          flake8 lib/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || true

      - name: 🔐 Security scan (Bandit)
        working-directory: LegacyProject/modernProject
        run: |
          bandit -r lib/ -ll || echo "::warning::Security issues found"

  # ---------------------------------------------------------------
  # Job 2: Unit Tests
  # ---------------------------------------------------------------
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dependencies
        working-directory: LegacyProject/modernProject
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        working-directory: LegacyProject/modernProject
        run: |
          pytest tests/test_*.py \
            --cov=lib \
            --cov-report=xml \
            --cov-report=term \
            -v

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./LegacyProject/modernProject/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ---------------------------------------------------------------
  # Job 3: Integration Tests
  # ---------------------------------------------------------------
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        working-directory: LegacyProject/modernProject
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔗 Run integration tests
        working-directory: LegacyProject/modernProject
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/integration/ -v --tb=short || echo "::warning::Some integration tests failed"

  # ---------------------------------------------------------------
  # Job 4: Build Docker
  # ---------------------------------------------------------------
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./LegacyProject/modernProject
          file: ./LegacyProject/modernProject/Dockerfile
          push: false
          tags: awkward-legacy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Job 5: Summary
  # ---------------------------------------------------------------
  summary:
    name: ✅ Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, integration, docker]
    if: always()

    steps:
      - name: 📊 Report Status
        run: |
          echo "## 🎉 CI/CD Pipeline Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration: ${{ needs.integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **AWKWARD LEGACY - Ready for deployment!**" >> $GITHUB_STEP_SUMMARY
