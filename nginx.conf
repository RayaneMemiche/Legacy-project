# =================================================================
# AWKWARD LEGACY - Nginx Configuration
# =================================================================
# Description: Configuration Nginx optimisée pour production
# Version: 1.21
# Date: 17 Octobre 2025
# =================================================================

# Configuration globale
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimisations des événements
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# Configuration HTTP
http {
    # =================================================================
    # Configuration de base
    # =================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Format de logs personnalisé
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json '{'
                    '"timestamp":"$time_iso8601",'
                    '"remote_addr":"$remote_addr",'
                    '"remote_user":"$remote_user",'
                    '"request":"$request",'
                    '"status":"$status",'
                    '"body_bytes_sent":"$body_bytes_sent",'
                    '"request_time":"$request_time",'
                    '"http_referrer":"$http_referer",'
                    '"http_user_agent":"$http_user_agent",'
                    '"http_x_forwarded_for":"$http_x_forwarded_for"'
                    '}';

    access_log /var/log/nginx/access.log json buffer=32k;

    # =================================================================
    # Optimisations de performance
    # =================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    types_hash_max_size 2048;
    server_tokens off;

    # Tailles de buffers
    client_body_buffer_size 128k;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 1 32k;
    postpone_output 1460;

    # =================================================================
    # Compression Gzip
    # =================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    # =================================================================
    # Compression Brotli (si module installé)
    # =================================================================
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/rss+xml application/atom+xml application/xhtml+xml;

    # =================================================================
    # Cache des fichiers ouverts
    # =================================================================
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # =================================================================
    # Rate limiting zones
    # =================================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # =================================================================
    # Upstream backend
    # =================================================================
    upstream awkward_backend {
        least_conn;
        server web:8080 max_fails=3 fail_timeout=30s;
        # Pour scaling horizontal
        # server web2:8080 max_fails=3 fail_timeout=30s;
        # server web3:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =================================================================
    # Serveur de redirection HTTP vers HTTPS
    # =================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Support pour Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirection vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =================================================================
    # Serveur HTTPS principal
    # =================================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name awkward-legacy.com www.awkward-legacy.com;

        # =================================================================
        # Configuration SSL/TLS
        # =================================================================
        ssl_certificate /etc/letsencrypt/live/awkward-legacy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/awkward-legacy.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/awkward-legacy.com/chain.pem;

        # Protocoles et ciphers modernes
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Session SSL
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # =================================================================
        # Headers de sécurité
        # =================================================================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # CSP (Content Security Policy)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.awkward-legacy.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # =================================================================
        # Locations
        # =================================================================

        # Fichiers statiques
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # Types de fichiers autorisés
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires max;
                add_header Cache-Control "public, immutable";
            }
        }

        # Uploads
        location /uploads/ {
            alias /data/uploads/;
            expires 7d;
            add_header Cache-Control "public, must-revalidate";

            # Sécurité pour les uploads
            location ~* \.(php|php3|php4|php5|phtml|pl|py|rb|sh|bash)$ {
                deny all;
            }
        }

        # Health check (pas de log)
        location /health {
            access_log off;
            proxy_pass http://awkward_backend;
            proxy_set_header Host $host;
        }

        # Metrics Prometheus (restreint)
        location /metrics {
            allow 172.20.0.0/16;  # Réseau Docker interne uniquement
            deny all;
            proxy_pass http://awkward_backend;
        }

        # API endpoints avec rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;

            proxy_pass http://awkward_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts pour API
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffers
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # CORS headers (si nécessaire)
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Authentication endpoints avec rate limiting strict
        location ~ ^/(login|register|password-reset) {
            limit_req zone=auth burst=2 nodelay;
            limit_conn addr 2;

            proxy_pass http://awkward_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support
        location /ws/ {
            proxy_pass http://awkward_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Application principale
        location / {
            limit_req zone=general burst=5 nodelay;
            limit_conn addr 20;

            proxy_pass http://awkward_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffers
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
            proxy_busy_buffers_size 16k;
            proxy_temp_file_write_size 64k;

            # Cache (si applicable)
            # proxy_cache main_cache;
            # proxy_cache_valid 200 302 10m;
            # proxy_cache_valid 404 1m;
            # proxy_cache_bypass $http_pragma $http_authorization;
            # proxy_no_cache $http_pragma $http_authorization;
        }

        # Page d'erreur personnalisée
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Sécurité: bloquer l'accès aux fichiers cachés
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Bloquer l'accès aux fichiers de backup
        location ~ ~$ {
            deny all;
        }

        # Robots.txt
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /api/\nDisallow: /admin/\nDisallow: /private/\nAllow: /\nSitemap: https://awkward-legacy.com/sitemap.xml\n";
        }

        # Favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
    }

    # =================================================================
    # Serveur de monitoring (interne uniquement)
    # =================================================================
    server {
        listen 8081;
        server_name localhost;

        # Restreindre aux IPs internes
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Docker network
        deny all;

        # Status Nginx
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # Health check simple
        location /ping {
            access_log off;
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }
    }
}